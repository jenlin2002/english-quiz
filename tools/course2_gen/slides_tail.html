
  </div>
  <button class="arrow-btn next" id="nextBtn" aria-label="下一頁">›</button>
</div>
<footer>
  <div class="counter" id="counter">1 / 1</div>
  <div class="dots" id="dots"></div>
</footer>
<script>
const slides = Array.prototype.slice.call(document.querySelectorAll('.s'));
const counter = document.getElementById('counter'), dotsWrap = document.getElementById('dots');
const prevBtn = document.getElementById('prevBtn'), nextBtn = document.getElementById('nextBtn');
let current = 0, curAudio = null;
const speechSupported = typeof window.speechSynthesis !== 'undefined';
let cachedVoices = [];
function refreshVoices(){ if(speechSupported) cachedVoices = window.speechSynthesis.getVoices(); }
if(speechSupported){ refreshVoices(); window.speechSynthesis.onvoiceschanged = refreshVoices; }
function pickVoice(){
  const en = cachedVoices.filter(v => v.lang && v.lang.startsWith('en'));
  const rank = v => (/natural|neural|online|google/i.test(v.name) ? 4 : 0) + (v.lang === 'en-US' ? 1 : 0);
  return en.sort((a, b) => rank(b) - rank(a))[0] || null;
}
function stopAll(){
  if(speechSupported) window.speechSynthesis.cancel();
  if(curAudio){ curAudio.pause(); curAudio = null; }
  document.querySelectorAll('.sentence-btn').forEach(b => b.classList.remove('playing'));
}
function speakTTS(text, btn){
  if(!speechSupported){ return; }
  if(!cachedVoices.length) refreshVoices();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.82;
  const v = pickVoice(); if(v) u.voice = v;
  btn.classList.add('playing');
  u.onend = u.onerror = () => btn.classList.remove('playing');
  window.speechSynthesis.speak(u);
}
function play(btn){
  stopAll();
  const all = Array.prototype.slice.call(document.querySelectorAll('.sentence-btn'));
  const idx = all.indexOf(btn) + 1;
  const a = new Audio('audio/slide-' + (idx < 10 ? '0' : '') + idx + '.mp3');
  let fell = false;
  const fb = () => { if(fell) return; fell = true; speakTTS(btn.getAttribute('data-say'), btn); };
  a.addEventListener('error', fb);
  a.addEventListener('ended', () => btn.classList.remove('playing'));
  btn.classList.add('playing');
  const p = a.play();
  if(p && p.catch) p.catch(e => { if(!(e && e.name === 'AbortError')) fb(); });
  curAudio = a;
}
document.addEventListener('click', e => {
  const b = e.target.closest('.sentence-btn');
  if(b){ e.stopPropagation(); play(b); return; }
  const r = e.target.closest('.rv');
  if(r){ const a = r.nextElementSibling; a.hidden = !a.hidden; r.textContent = a.hidden ? '看答案' : '收起'; }
});
function render(){
  slides.forEach((s, i) => s.classList.toggle('active', i === current));
  counter.textContent = (current + 1) + ' / ' + slides.length;
  prevBtn.disabled = current === 0; nextBtn.disabled = current === slides.length - 1;
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current));
  stopAll();
  window.scrollTo(0, 0);
  try{ history.replaceState(null, '', '#' + (current + 1)); }catch(e){}
}
function goTo(i){ if(i < 0 || i >= slides.length) return; current = i; render(); }
prevBtn.addEventListener('click', () => goTo(current - 1));
nextBtn.addEventListener('click', () => goTo(current + 1));
document.addEventListener('keydown', e => { if(e.key === 'ArrowLeft') goTo(current - 1); if(e.key === 'ArrowRight') goTo(current + 1); });
let tx = null;
document.querySelector('.stage').addEventListener('touchstart', e => { tx = e.touches[0].clientX; });
document.querySelector('.stage').addEventListener('touchend', e => {
  if(tx === null) return; const dx = e.changedTouches[0].clientX - tx;
  if(dx > 60) goTo(current - 1); if(dx < -60) goTo(current + 1); tx = null;
});
slides.forEach((_, i) => { const b = document.createElement('button'); b.className = 'dot'; b.setAttribute('aria-label', '第 ' + (i + 1) + ' 頁'); b.addEventListener('click', () => goTo(i)); dotsWrap.appendChild(b); });
const start = parseInt((location.hash || '').replace('#', ''), 10);
current = isNaN(start) ? 0 : Math.max(0, Math.min(slides.length - 1, start - 1));
render();
</script>
</body>
</html>
