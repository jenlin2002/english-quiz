<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英文測驗系統｜第十一週：現在完成式</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --chalk-bg: #1B3A2F;
    --paper: #F7F3E8;
    --paper-2: #EFE9D8;
    --chalk-yellow: #E8B94A;
    --chalk-red: #D97A6C;
    --chalk-green: #7FB69A;
    --ink: #2B2B2B;
    --ink-soft: #5B5B52;
    --line: #D8D0BA;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html, body{ overflow-x:hidden; width:100%; }
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,0.03) 0, transparent 40%),
      radial-gradient(circle at 80% 85%, rgba(255,255,255,0.03) 0, transparent 40%),
      var(--chalk-bg);
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    padding:32px 16px 60px;
    -webkit-text-size-adjust:100%;
  }
  button{ touch-action:manipulation; }

  .board-header{ width:100%; max-width:780px; text-align:center; margin-bottom:22px; }
  .eyebrow{
    font-family:'Space Mono', monospace; letter-spacing:0.2em; font-size:12px;
    color:var(--chalk-yellow); text-transform:uppercase; opacity:0.85; margin-bottom:10px;
  }
  .board-title{
    font-family:'Kalam', cursive; font-weight:700; font-size:clamp(26px, 5vw, 40px);
    color:var(--paper); margin:0 0 6px;
  }
  .board-sub{ font-size:14px; color:rgba(247,243,232,0.65); }

  .mode-tabs{ display:flex; justify-content:center; gap:10px; margin-top:22px; flex-wrap:wrap; }
  .mode-btn{
    font-family:'Noto Sans TC', sans-serif; font-weight:700; font-size:14px;
    padding:12px 22px; min-height:44px; border-radius:999px; border:2px solid rgba(247,243,232,0.25);
    background:transparent; color:rgba(247,243,232,0.75); cursor:pointer;
    transition: all 0.15s ease;
  }
  .mode-btn.active{ background:var(--chalk-yellow); border-color:var(--chalk-yellow); color:#1B3A2F; }
  .mode-btn:hover:not(.active){ border-color:var(--chalk-yellow); color:var(--paper); }

  .tally-wrap{ display:flex; align-items:flex-end; justify-content:center; gap:26px; margin-top:20px; flex-wrap:wrap; }
  .tally-wrap.hidden{ display:none; }
  .tally-group{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .tally-label{ font-size:11px; color:rgba(247,243,232,0.55); font-family:'Space Mono',monospace; letter-spacing:0.1em; }
  .tally-chars{ display:flex; gap:6px; }
  .tally-char{ width:34px; height:42px; stroke-width:5; fill:none; stroke-linecap:round; }
  .tally-char path{ opacity:0.15; transition: opacity 0.3s ease; }
  .tally-char path.on{ opacity:1; }
  .tally-char.correct path.on{ stroke:var(--chalk-green); }
  .tally-char.wrong path.on{ stroke:var(--chalk-red); }

  .speak-progress{ display:none; margin-top:18px; }
  .speak-progress.show{ display:block; }
  .dots{ display:flex; justify-content:center; gap:8px; }
  .dot-item{ width:10px; height:10px; border-radius:50%; background:rgba(247,243,232,0.25); transition:all .2s ease; }
  .dot-item.done{ background:var(--chalk-green); }
  .dot-item.active{ background:var(--chalk-yellow); transform:scale(1.3); }

  .quiz-card{
    width:100%; max-width:780px; background:var(--paper); border-radius:18px;
    padding:34px 32px 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    position:relative; border:1px solid rgba(0,0,0,0.04); margin-top:26px;
  }
  .quiz-card::before{ content:""; position:absolute; top:0; left:28px; right:28px; height:1px; background:var(--line); }
  @media (max-width:480px){
    .quiz-card{ padding:24px 18px 22px; border-radius:14px; }
    body{ padding:22px 10px 44px; }
  }

  .passage-box{
    background:var(--paper-2); border-radius:12px; padding:22px 24px;
    margin-bottom:24px; font-size:19px; line-height:1.95; border:1px solid var(--line);
  }
  .passage-box h3{ margin:0 0 12px; font-family:'Kalam',cursive; font-size:23px; color:var(--ink); }

  .qnum-row{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; }
  .qnum{ font-family:'Kalam', cursive; font-weight:700; font-size:24px; color:var(--ink-soft); }
  .qnum b{ font-size:38px; color:var(--ink); }
  .qtag{
    font-family:'Space Mono', monospace; font-size:13px; letter-spacing:0.08em;
    padding:7px 14px; border-radius:999px; background:var(--paper-2); color:var(--ink-soft);
    border:1px solid var(--line);
  }

  .question-text{ font-size:clamp(24px, 3.6vw, 30px); line-height:1.6; font-weight:500; margin:0 0 28px; }
  .question-text .blank{ display:inline-block; min-width:100px; border-bottom:2px solid var(--ink); text-align:center; }

  .options{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:560px){ .options{ grid-template-columns:1fr; } }

  .option-btn{
    font-family:'Noto Sans TC', sans-serif; font-size:21px; font-weight:500; text-align:left;
    padding:18px 20px; border-radius:12px; border:2px solid var(--line); background:#fff;
    cursor:pointer; transition: all 0.15s ease; color:var(--ink);
  }
  .option-btn:hover:not(:disabled){ border-color:var(--ink); transform:translateY(-1px); }
  .option-btn:disabled{ cursor:default; }
  .option-btn.correct{ background:rgba(127,182,154,0.18); border-color:var(--chalk-green); color:#1F5E43; font-weight:700; }
  .option-btn.wrong{ background:rgba(217,122,108,0.14); border-color:var(--chalk-red); color:#9C3B2C; }

  .feedback{ margin-top:20px; padding:18px 20px; border-radius:12px; font-size:18px; line-height:1.75; display:none; }
  .feedback.show{ display:block; }
  .feedback.correct{ background:rgba(127,182,154,0.15); color:#1F5E43; }
  .feedback.wrong{ background:rgba(217,122,108,0.12); color:#9C3B2C; }

  .footer-row{ display:flex; justify-content:flex-end; margin-top:24px; gap:10px; flex-wrap:wrap; }
  .footer-row.split{ justify-content:space-between; }
  .next-btn, .nav-btn{
    font-family:'Noto Sans TC', sans-serif; font-weight:700; font-size:15px; padding:14px 26px;
    border-radius:999px; border:none; background:var(--ink); color:var(--paper); cursor:pointer;
    transition: opacity 0.2s ease, background 0.2s ease; min-height:44px;
  }
  .next-btn{ opacity:0.3; pointer-events:none; }
  .next-btn.active{ opacity:1; pointer-events:auto; }
  .next-btn:hover.active{ background:#000; }
  .nav-btn.ghost{ background:transparent; border:2px solid var(--ink); color:var(--ink); }
  .nav-btn:disabled{ opacity:0.25; pointer-events:none; }

  /* Speaking mode */
  .speak-card-inner{ text-align:left; }
  .speak-eyebrow{ font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.1em; color:var(--ink-soft); margin-bottom:8px; }
  .speak-en-row{ display:flex; align-items:center; gap:14px; margin-bottom:10px; flex-wrap:wrap; }
  .speak-en{ font-size:clamp(19px,2.8vw,26px); font-weight:600; line-height:1.5; flex:1; min-width:200px; }
  .speak-btn{
    flex-shrink:0; width:50px; height:50px; min-width:50px; border-radius:50%; border:none;
    background:var(--chalk-green); color:#fff; font-size:20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition: transform .15s ease, background .15s ease;
  }
  .speak-btn:hover{ transform:scale(1.08); background:#6BA085; }
  .speak-btn.playing{ animation: pulse 1s infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(127,182,154,0.5);} 70%{box-shadow:0 0 0 12px rgba(127,182,154,0);} 100%{box-shadow:0 0 0 0 rgba(127,182,154,0);} }
  .speak-hint{ font-size:13px; color:var(--ink-soft); font-style:italic; margin-bottom:22px; }

  .record-box{
    margin-top:20px; background:var(--paper-2); border-radius:12px; padding:18px 20px; border:1px solid var(--line);
  }
  .record-box-label{ font-family:'Space Mono',monospace; font-size:10px; letter-spacing:0.1em; color:var(--ink-soft); margin-bottom:12px; }
  .record-controls{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .record-btn{
    display:flex; align-items:center; gap:10px; font-family:'Noto Sans TC'; font-weight:700; font-size:15px;
    padding:12px 22px; min-height:44px; border-radius:999px; border:none; background:var(--chalk-red); color:#fff; cursor:pointer;
    transition: all .15s ease;
  }
  .record-btn:hover{ opacity:0.9; }
  .record-btn.recording{ background:#9C3B2C; animation: recPulse 1.1s infinite; }
  @keyframes recPulse{ 0%{box-shadow:0 0 0 0 rgba(156,59,44,0.5);} 70%{box-shadow:0 0 0 14px rgba(156,59,44,0);} 100%{box-shadow:0 0 0 0 rgba(156,59,44,0);} }
  .record-dot{ width:10px; height:10px; border-radius:50%; background:#fff; }
  .record-status{ font-size:13px; color:var(--ink-soft); font-family:'Space Mono',monospace; }
  .record-playback{ margin-top:14px; }
  .record-playback audio{ width:100%; }
  .record-transcript{
    margin-top:14px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px;
    font-size:16px; line-height:1.6; color:var(--ink);
  }
  .record-transcript-label{ font-family:'Space Mono',monospace; font-size:10px; letter-spacing:0.1em; color:var(--ink-soft); margin-bottom:6px; }
  .record-submit-btn{
    margin-top:14px; font-family:'Noto Sans TC'; font-weight:700; font-size:15px; padding:12px 26px; min-height:44px;
    border-radius:999px; border:none; background:var(--ink); color:var(--paper); cursor:pointer;
  }
  .record-submit-btn:disabled{ opacity:0.3; pointer-events:none; }
  .record-result{ margin-top:14px; padding:14px 16px; border-radius:10px; font-size:15px; line-height:1.7; display:none; }
  .record-result.show{ display:block; }
  .record-result.ok{ background:rgba(127,182,154,0.15); color:#1F5E43; }
  .record-result.err{ background:rgba(217,122,108,0.12); color:#9C3B2C; }
  .record-unsupported{ font-size:13px; color:var(--chalk-red); }

  .listening-image-box{
    background:var(--paper-2); border-radius:14px; padding:14px; margin-bottom:18px;
    border:1px solid var(--line); max-width:420px;
  }
  .listening-image-box svg{ width:100%; height:auto; display:block; }
  .listening-image-box img{ width:100%; height:auto; display:block; border-radius:10px; background:var(--paper); min-height:120px; }
  .listening-image-credit{ font-size:10px; color:var(--ink-soft); opacity:0.7; margin-top:6px; text-align:right; font-family:'Space Mono',monospace; }
  .listening-image-error{ padding:14px; color:var(--chalk-red); font-size:13px; text-align:center; }
  .listening-video-box{
    display:block; position:relative; width:100%; max-width:480px; border-radius:14px;
    overflow:hidden; margin-bottom:6px; background:#000; text-decoration:none; border:1px solid var(--line);
  }
  .listening-video-box img{ width:100%; height:auto; display:block; opacity:0.85; }
  .listening-video-play{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:64px; height:64px; border-radius:50%; background:rgba(216,48,40,0.92);
    display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(0,0,0,0.4);
  }
  .listening-video-play::after{
    content:""; width:0; height:0; margin-left:5px;
    border-top:13px solid transparent; border-bottom:13px solid transparent; border-left:22px solid #fff;
  }
  .listening-video-label{
    position:absolute; bottom:0; left:0; right:0; padding:10px 14px;
    background:linear-gradient(transparent, rgba(0,0,0,0.75));
    color:#fff; font-family:'Noto Sans TC'; font-size:13px; font-weight:700;
  }
  .listening-audio-row{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:22px; }
  .listening-audio-row .record-btn{ background:var(--chalk-green); }

  .reveal-btn{
    font-family:'Noto Sans TC'; font-weight:700; font-size:14px; padding:11px 22px;
    border-radius:999px; border:2px dashed var(--chalk-yellow); background:rgba(232,185,74,0.12);
    color:#8A6410; cursor:pointer; transition:all .15s ease;
  }
  .reveal-btn:hover{ background:rgba(232,185,74,0.25); }

  .sample-box{
    display:none; margin-top:18px; background:var(--paper-2); border-radius:12px;
    padding:16px 18px; border:1px solid var(--line);
  }
  .sample-box.show{ display:block; }
  .sample-box-label{ font-family:'Space Mono',monospace; font-size:10px; letter-spacing:0.1em; color:var(--ink-soft); margin-bottom:8px; }
  .sample-row{ display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .sample-text{ font-size:19px; line-height:1.75; color:var(--ink); flex:1; min-width:200px; }
  .sample-speak-btn{
    flex-shrink:0; width:40px; height:40px; min-width:40px; border-radius:50%; border:none;
    background:var(--chalk-yellow); color:#1B3A2F; font-size:15px; cursor:pointer;
  }
  .sample-speak-btn:hover{ opacity:0.85; }
  .example-zh-text{ margin-top:8px; font-size:17px; color:var(--ink-soft); line-height:1.75; }

  .cloze-audio-row{ display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .cloze-audio-status{ font-family:'Space Mono',monospace; font-size:12px; color:var(--ink-soft); }
  .cloze-audio-status.done{ color:#1F5E43; }

  .result-wrap{ text-align:center; padding:16px 10px; }
  .result-score{ font-family:'Kalam', cursive; font-weight:700; font-size:52px; margin:10px 0 4px; }
  .result-msg{ font-size:15px; color:var(--ink-soft); margin-bottom:26px; }
  .restart-btn{
    font-family:'Noto Sans TC', sans-serif; font-weight:700; font-size:15px; padding:12px 28px;
    border-radius:999px; border:2px solid var(--ink); background:transparent; color:var(--ink); cursor:pointer;
  }
  .restart-btn:hover{ background:var(--ink); color:var(--paper); }

  .review-list{ text-align:left; margin-top:24px; border-top:1px solid var(--line); padding-top:20px; max-height:340px; overflow-y:auto; }
  .review-item{ font-size:13px; padding:8px 0; border-bottom:1px dashed var(--line); color:var(--ink-soft); }
  .review-item b{ color:var(--ink); }

  .no-speech-note{ font-size:12px; color:var(--chalk-red); margin-top:10px; display:none; }
  .no-speech-note.show{ display:block; }

  .scramble-box{ margin-top:18px; background:var(--paper-2); border-radius:12px; padding:16px 18px; border:1px solid var(--line); display:none; }
  .scramble-box.show{ display:block; }
  .scramble-label{ font-family:'Space Mono',monospace; font-size:10px; letter-spacing:0.1em; color:var(--ink-soft); margin-bottom:8px; }
  .scramble-zh{ font-size:19px; color:var(--ink); margin-bottom:16px; line-height:1.75; font-weight:500; }
  .scramble-answer-row{
    display:flex; flex-wrap:wrap; align-items:center; gap:8px; min-height:48px; padding:10px;
    background:#fff; border:2px dashed var(--line); border-radius:10px; margin-bottom:12px; transition:border-color .15s ease;
  }
  .scramble-answer-row.correct{ border-color:var(--chalk-green); border-style:solid; background:rgba(127,182,154,0.08); }
  .scramble-answer-row.wrong-shake{ border-color:var(--chalk-red); animation: scrambleShake .3s; }
  @keyframes scrambleShake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
  .scramble-placeholder{ color:var(--ink-soft); font-size:13px; }
  .scramble-tile{
    padding:12px 18px; min-height:46px; border-radius:8px; background:var(--paper); border:1px solid var(--line);
    font-family:'Noto Sans TC'; font-size:18px; cursor:pointer; transition:all .15s ease;
  }
  .scramble-tile:hover{ border-color:var(--ink); transform:translateY(-1px); }
  .scramble-tile.placed{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .scramble-tile:disabled{ cursor:default; opacity:0.85; }
  .scramble-pool{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .scramble-actions{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .scramble-check-btn{
    font-family:'Noto Sans TC'; font-weight:700; font-size:14px; padding:11px 24px; min-height:42px;
    border-radius:999px; border:none; background:var(--ink); color:var(--paper); cursor:pointer;
  }
  .scramble-check-btn:disabled{ opacity:0.3; pointer-events:none; }
  .scramble-reset-btn{
    font-family:'Noto Sans TC'; font-weight:600; font-size:13px; padding:10px 18px; min-height:42px;
    border-radius:999px; border:2px solid var(--line); background:transparent; color:var(--ink-soft); cursor:pointer;
  }
  .scramble-reset-btn:disabled{ opacity:0.3; pointer-events:none; }
  .scramble-msg{ font-size:13px; font-family:'Space Mono',monospace; }
  .scramble-msg.ok{ color:#1F5E43; }
  .scramble-msg.err{ color:#9C3B2C; }

  .id-row{ display:flex; justify-content:center; gap:10px; margin-top:16px; flex-wrap:wrap; align-items:center; }
  .id-btn{
    font-family:'Noto Sans TC'; font-weight:700; font-size:13px; padding:9px 18px; min-height:40px;
    border-radius:999px; border:2px solid rgba(247,243,232,0.2); background:rgba(255,255,255,0.04);
    color:rgba(247,243,232,0.7); cursor:pointer; transition:all .15s ease;
  }
  .id-btn.active{ background:var(--chalk-green); border-color:var(--chalk-green); color:#0F2A20; }
  .settings-toggle{
    font-family:'Space Mono',monospace; font-size:11px; padding:8px 14px; min-height:40px;
    border-radius:999px; border:1px solid rgba(247,243,232,0.2); background:transparent;
    color:rgba(247,243,232,0.55); cursor:pointer;
  }
  .settings-panel{
    display:none; margin:14px auto 0; max-width:520px; background:rgba(0,0,0,0.2);
    border-radius:12px; padding:14px 16px; text-align:left;
  }
  .settings-panel.show{ display:block; }
  .settings-panel label{ font-size:11px; color:rgba(247,243,232,0.6); font-family:'Space Mono',monospace; display:block; margin-bottom:6px; }
  .settings-row{ display:flex; gap:8px; }
  .settings-row input{
    flex:1; padding:9px 10px; border-radius:8px; border:1px solid rgba(247,243,232,0.25);
    background:rgba(255,255,255,0.06); color:var(--paper); font-family:'Space Mono',monospace; font-size:12px;
  }
  .settings-row input::placeholder{ color:rgba(247,243,232,0.35); }
  .settings-save{
    font-family:'Noto Sans TC'; font-weight:700; font-size:12px; padding:0 16px; border-radius:8px;
    border:none; background:var(--chalk-yellow); color:#1B3A2F; cursor:pointer;
  }
  .settings-status{ font-size:11px; margin-top:8px; color:rgba(247,243,232,0.5); font-family:'Space Mono',monospace; }
  .sync-status{ margin-top:10px; font-size:12px; font-family:'Space Mono',monospace; }
  .sync-status.ok{ color:#1F5E43; }
  .sync-status.pending{ color:var(--ink-soft); }
  .sync-status.off{ color:var(--chalk-red); }
</style>
</head>
<body>

<div class="board-header">
  <div class="eyebrow">Week 11 · Test System</div>
  <h1 class="board-title" id="mainTitle">現在完成式</h1>
  <div class="board-sub" id="subTitle">文法測驗．共 20 題．每題點選答案後立即顯示對錯與說明</div>

  <div class="id-row">
    <span style="font-size:11px;color:rgba(247,243,232,0.5);font-family:'Space Mono',monospace;">目前是誰在測驗：</span>
    <button class="id-btn" id="idBig">BRANDEN</button>
    <button class="id-btn" id="idSmall">MELISSA</button>
    <button class="settings-toggle" id="settingsToggle">☁️ 同步設定</button>
  </div>
  <div class="settings-panel" id="settingsPanel">
    <label>Google試算表同步網址（Apps Script Web App URL）</label>
    <div class="settings-row">
      <input type="text" id="syncUrlInput" placeholder="https://script.google.com/macros/s/xxxx/exec">
      <button class="settings-save" id="syncUrlSave">儲存</button>
    </div>
    <div class="settings-status" id="settingsStatus">尚未設定，測驗結果暫時不會自動回傳</div>
  </div>

  <div class="mode-tabs">
    <button class="mode-btn active" id="tabGrammar">📘 文法測驗</button>
    <button class="mode-btn" id="tabReading">📖 閱讀測驗</button>
    <button class="mode-btn" id="tabCloze">✏️ 克漏字</button>
    <button class="mode-btn" id="tabVocab">🔤 單字測驗</button>
    <button class="mode-btn" id="tabListening">🎧 聽力測驗</button>
    <button class="mode-btn" id="tabSpeaking">🎤 口說練習</button>
  </div>

const speechSupported = typeof window.speechSynthesis !== 'undefined';

// ---------- Voice loading (fixes "shows playing but silent" on freshly-loaded HTTPS pages) ----------
// 部分瀏覽器（尤其 Chrome/Edge）在頁面剛載入、語音清單(voices)還沒準備好時呼叫 speak()，
// 會出現「事件正常觸發、畫面顯示播放中，但實際上沒有聲音」的狀況。
// 這裡確保語音清單載入完成後才真正播放，並明確指定語音，避免瀏覽器選到空的/無聲的語音。
let cachedVoices = [];
function refreshVoiceCache(){
  if(speechSupported) cachedVoices = window.speechSynthesis.getVoices();
}
if(speechSupported){
  refreshVoiceCache();
  window.speechSynthesis.onvoiceschanged = refreshVoiceCache;
}

function pickVoice(lang){
  if(!cachedVoices.length) refreshVoiceCache();
  const prefix = lang.split('-')[0];
  // 優先順序：完全符合語言代碼且是「本機內建」的語音 > 本機內建的同語系語音 > 完全符合但雲端的 > 同語系但雲端的
  // 本機內建(localService===true)比較不會有「語音清單裡有、但實際語音包還沒下載完成」導致無聲的問題（Edge常見）
  const exactLocal = cachedVoices.find(v => v.lang === lang && v.localService === true);
  if(exactLocal) return exactLocal;
  const prefixLocal = cachedVoices.find(v => v.lang && v.lang.startsWith(prefix) && v.localService === true);
  if(prefixLocal) return prefixLocal;
  const exact = cachedVoices.find(v => v.lang === lang);
  if(exact) return exact;
  const partial = cachedVoices.find(v => v.lang && v.lang.startsWith(prefix));
  return partial || null;
}

function whenVoicesReady(callback){
  if(cachedVoices.length > 0){ callback(); return; }
  refreshVoiceCache();
  if(cachedVoices.length > 0){ callback(); return; }
  let done = false;
  const finish = () => { if(done) return; done = true; callback(); };
  window.speechSynthesis.onvoiceschanged = () => { refreshVoiceCache(); finish(); };
  setTimeout(finish, 400); // fallback，避免某些瀏覽器不觸發 voiceschanged 導致卡住不出聲
}

// 首次互動時「暖機」一次語音引擎（部分瀏覽器第一次呼叫 speak() 容易無聲，暖機可大幅降低機率）
let speechWarmedUp = false;
function warmUpSpeech(){
  if(speechWarmedUp || !speechSupported) return;
  speechWarmedUp = true;
  try{
    const warm = new SpeechSynthesisUtterance(' ');
    warm.volume = 0;
    warm.rate = 10;
    window.speechSynthesis.speak(warm);
  }catch(e){}
}
document.addEventListener('click', warmUpSpeech, { once: true, capture: true });

function speak(text, btnEl, onEnd){
  if(!speechSupported){ if(onEnd) onEnd(); return; }
  whenVoicesReady(() => {
    window.speechSynthesis.cancel();
    window.speechSynthesis.resume(); // Edge/Chromium 偶爾會卡在暫停狀態，播放前先確保是恢復狀態
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = 0.75;
    const v = pickVoice('en-US');
    if(v) utter.voice = v;
    attachSpeechHandlers(utter, btnEl, onEnd);
    currentUtterance = utter;
    window.speechSynthesis.speak(utter);
  });
}

function speakZh(text, btnEl, onEnd){
  if(!speechSupported){ if(onEnd) onEnd(); return; }
  whenVoicesReady(() => {
    window.speechSynthesis.cancel();
    window.speechSynthesis.resume();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'zh-TW';
    utter.rate = 0.88;
    const v = pickVoice('zh-TW');
    if(v) utter.voice = v;
    attachSpeechHandlers(utter, btnEl, onEnd);
    currentUtterance = utter;
    window.speechSynthesis.speak(utter);
  });
}

function attachSpeechHandlers(utter, btnEl, onEnd){
  if(btnEl){
    btnEl.classList.add('playing');
    utter.onend = () => { btnEl.classList.remove('playing'); if(onEnd) onEnd(); };
    utter.onerror = () => { btnEl.classList.remove('playing'); if(onEnd) onEnd(); };
  } else {
    utter.onend = () => { if(onEnd) onEnd(); };
    utter.onerror = () => { if(onEnd) onEnd(); };
  }
}

function speakSequence(textList, onAllDone){
  let i = 0;
  function playNext(){
    if(i >= textList.length){ if(onAllDone) onAllDone(); return; }
    const text = textList[i];
    i++;
    speak(text, null, () => setTimeout(playNext, 550));
  }
  playNext();
}

async function syncResult(modeLabel, score, total, details){
  const statusEl = document.getElementById('syncStatusEl');
  if(!syncUrl){
    if(statusEl){ statusEl.textContent = '☁️ 尚未設定同步網址，成績未回傳（點上方「同步設定」）'; statusEl.className = 'sync-status off'; }

  }
  if(!studentName){
    if(statusEl){ statusEl.textContent = '☁️ 尚未選擇是 BRANDEN 還是 MELISSA，成績未回傳'; statusEl.className = 'sync-status off'; }
    return;
  }
  if(statusEl){ statusEl.textContent = '☁️ 同步中...'; statusEl.className = 'sync-status pending'; }
  const payload = {
    name: studentName, week: WEEK_LABEL, mode: modeLabel,
    score: score, total: total, percent: Math.round((score/total)*100),
    details: (details || []).map(h => ({ q: h.q, picked: h.picked, correct: h.correct, isCorrect: h.isCorrect }))
  };
  try{
    await fetch(syncUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    if(statusEl){ statusEl.textContent = '☁️ 已送出同步（含每題明細，因瀏覽器限制無法確認送達，可到試算表確認）'; statusEl.className = 'sync-status ok'; }
  }catch(e){
    if(statusEl){ statusEl.textContent = '☁️ 同步失敗，請檢查網路連線'; statusEl.className = 'sync-status off'; }
  }
}

function renderTallyGroup(containerId, count, cls){

// ---------- Vocab sentence-scramble exercise ----------
let scramblePool = [];
let scrambleAnswer = [];
let scrambleSolved = false;

function tokenizeSentence(sentence){
  return sentence.split(' ').map((text, id) => ({ id, text }));
}

function shuffleTokens(tokens){
  const arr = tokens.slice();
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function initScramble(q){
  const tokens = tokenizeSentence(q.scrambleSentence);
  let pool = shuffleTokens(tokens);
  if(pool.length > 1){
    let attempts = 0;
    while(pool.every((t, i) => t.id === i) && attempts < 10){
      pool = shuffleTokens(tokens);
      attempts++;
    }
  }
  scramblePool = pool;
  scrambleAnswer = [];
  scrambleSolved = false;
}

function renderScramble(q){
  const box = document.getElementById('scrambleSection');
  if(!box) return;

  box.innerHTML = `
    <div class="scramble-label">SENTENCE ORDER · 句子重組</div>
    <div class="scramble-zh">${q.zh}</div>
    <div class="scramble-answer-row ${scrambleSolved ? 'correct' : ''}" id="scrambleAnswerRow">
      ${scrambleAnswer.length === 0
        ? `<span class="scramble-placeholder">點選下方單字，依序組成正確的英文句子</span>`
        : scrambleAnswer.map(t => `<button class="scramble-tile placed" data-id="${t.id}" ${scrambleSolved ? 'disabled' : ''}>${t.text}</button>`).join('')}
      ${scrambleSolved ? `<button class="sample-speak-btn" id="scrambleReplayBtn" title="播放句子語音" style="margin-left:6px;">🔊</button>` : ''}
    </div>
    <div class="scramble-pool" id="scramblePool">
      ${scramblePool.map(t => `<button class="scramble-tile" data-id="${t.id}">${t.text}</button>`).join('')}
    </div>
    <div class="scramble-actions">
      <button class="scramble-check-btn" id="scrambleCheckBtn" ${(scrambleAnswer.length === 0 || scrambleSolved) ? 'disabled' : ''}>檢查</button>
      <button class="scramble-reset-btn" id="scrambleResetBtn" ${scrambleSolved ? 'disabled' : ''}>清除重來</button>
      <div class="scramble-msg" id="scrambleMsg"></div>
    </div>
  `;

  if(scrambleSolved){
    const msg = document.getElementById('scrambleMsg');
    if(msg){ msg.textContent = '✓ 完全正確！可以進行下一題了'; msg.className = 'scramble-msg ok'; }
    const replayBtn = document.getElementById('scrambleReplayBtn');
    if(replayBtn) replayBtn.addEventListener('click', (e) => speak(q.scrambleSentence, e.currentTarget));
    return;
  }

  box.querySelectorAll('#scramblePool .scramble-tile').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = parseInt(btn.dataset.id);
      const idx = scramblePool.findIndex(t => t.id === id);
      if(idx > -1){
        const [tok] = scramblePool.splice(idx, 1);
        scrambleAnswer.push(tok);
        renderScramble(q);
      }
    });
  });

  box.querySelectorAll('#scrambleAnswerRow .scramble-tile').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = parseInt(btn.dataset.id);
      const idx = scrambleAnswer.findIndex(t => t.id === id);
      if(idx > -1){
        const [tok] = scrambleAnswer.splice(idx, 1);
        scramblePool.push(tok);
        renderScramble(q);
      }
    });
  });

  document.getElementById('scrambleCheckBtn').addEventListener('click', () => {
    const correctTokens = tokenizeSentence(q.scrambleSentence);
    const isRight = scrambleAnswer.length === correctTokens.length && scrambleAnswer.every((t, i) => t.id === i);
    const msg = document.getElementById('scrambleMsg');
    const row = document.getElementById('scrambleAnswerRow');
    if(isRight){
      scrambleSolved = true;
      const nextBtn = document.getElementById('nextBtn');
      if(nextBtn) nextBtn.classList.add('active');
      renderScramble(q);
      speak(q.scrambleSentence, document.getElementById('scrambleReplayBtn'));
    } else {
      msg.textContent = '✕ 順序不對，再試一次';
      msg.className = 'scramble-msg err';
      row.classList.add('wrong-shake');
      setTimeout(() => row.classList.remove('wrong-shake'), 300);
    }
  });

  document.getElementById('scrambleResetBtn').addEventListener('click', () => {
    initScramble(q);
    renderScramble(q);
  });
}

function handleAnswer(i){
  if(answered) return;
  answered = true;
  const q = questions[current];
  const isCorrect = i === q.answer;
  if(isCorrect){ correctCount++; } else { wrongCount++; }
  const historyQ = mode === 'listening' ? (q.audioQuestion || q.text.replace(/<[^>]+>/g,'___')) : q.text.replace(/<[^>]+>/g,'___');
  history.push({q: historyQ, picked: q.options[i], correct: q.options[q.answer], isCorrect});
  renderTally();

  document.querySelectorAll('.option-btn').forEach((btn, idx)=>{
    btn.disabled = true;
    if(mode === 'listening'){
      btn.innerHTML = `<b style="margin-right:8px;">${String.fromCharCode(65+idx)}.</b>${q.options[idx]}`;
    }
    if(idx === q.answer) btn.classList.add('correct');
    if(idx === i && !isCorrect) btn.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');
  fb.classList.add('show', isCorrect ? 'correct' : 'wrong');

  const exampleBox = document.getElementById('vocabExampleBox');
  if(exampleBox) exampleBox.classList.add('show');

  const scrambleBox = document.getElementById('scrambleSection');
  if(scrambleBox){
    fb.innerHTML = (isCorrect ? '✓ 答對了！　' : '✕ 再想想～　') + q.note;
    scrambleBox.classList.add('show');
    // 單字模式：要先完成句子重組才能進下一題，不在這裡啟用 nextBtn
  } else if(mode === 'cloze' || mode === 'grammar' || mode === 'reading' || mode === 'listening'){
    renderAudioGatedFeedback(fb, q, isCorrect);
  } else {
    fb.innerHTML = (isCorrect ? '✓ 答對了！　' : '✕ 再想想～　') + q.note;
    document.getElementById('nextBtn').classList.add('active');
  }
}

function analyzeSpeaking(q, transcript){
  const resultEl = document.getElementById('recordResult');
  if(!resultEl) return;
  const t = (transcript || '').trim();
  if(!t){
    resultEl.innerHTML = '沒有偵測到語音內容，請重新錄音一次，錄音時請對著麥克風清楚說出完整句子。';
    resultEl.className = 'record-result show err';
    return;
  }
  const lower = t.toLowerCase();
  const hasPresentContinuous = /\b(am|is|are)\s+\w+ing\b/.test(lower);
  const hasPastContinuous = /\b(was|were)\s+\w+ing\b/.test(lower);
  let ok = true;
  let msg = '';

  if(q.checkType === 'simple'){

function initRecordUI(q){
  cleanupRecording();
  const recordBtn = document.getElementById('recordBtn');
  const recordBtnText = document.getElementById('recordBtnText');
  const recordStatus = document.getElementById('recordStatus');
  const playbackBox = document.getElementById('recordPlayback');
  const transcriptBox = document.getElementById('recordTranscriptBox');
  const transcriptText = document.getElementById('recordTranscriptText');
  const submitBtn = document.getElementById('recordSubmitBtn');
  const resultEl = document.getElementById('recordResult');
  if(!recordBtn) return;

  playbackBox.innerHTML = '';
  transcriptBox.style.display = 'none';
  transcriptText.textContent = '';
  resultEl.classList.remove('show');
  submitBtn.disabled = true;

  const hasMediaSupport = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  const SpeechRecCtor = window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!hasMediaSupport){
    recordBtn.disabled = true;
    recordBtnText.textContent = '不支援錄音';
    recordStatus.textContent = location.protocol === 'file:'
      ? '此瀏覽器在本機開啟檔案時不支援錄音，請改用「上傳到雲端硬碟後用瀏覽器開啟連結」的方式使用，或改用電腦版 Chrome。'
      : '此瀏覽器不支援錄音功能，建議改用電腦版 Chrome。';
    recordStatus.classList.add('record-unsupported');
    return;
  }

  let isRecording = false;
  let isBusy = false; // 避免在取得麥克風權限的過程中重複點擊

  async function ensureMicStream(){
    if(micStream && micStream.getTracks().some(t => t.readyState === 'live')){
      return micStream;
    }
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    return micStream;
  }

  function startNewRecognition(){
    if(!SpeechRecCtor) return;
    try{
      sttRecognition = new SpeechRecCtor();
      sttRecognition.lang = 'en-US';
      sttRecognition.continuous = true;
      sttRecognition.interimResults = true;
      sttRecognition.onresult = (event) => {
        let finalText = '';
        for(let i = 0; i < event.results.length; i++){
          finalText += event.results[i][0].transcript;
        }
        liveTranscript = finalText;
        transcriptBox.style.display = 'block';
        transcriptText.textContent = liveTranscript;
      };
      sttRecognition.onerror = () => {};
      sttRecognition.start();
    }catch(e){}
  }

  recordBtn.addEventListener('click', async () => {
    if(isBusy) return;

    if(!isRecording){
      isBusy = true;
      recordStatus.classList.remove('record-unsupported');
      recordStatus.textContent = '正在啟動麥克風...';
      try{
        await ensureMicStream();
      }catch(err){
        recordStatus.textContent = '無法取得麥克風權限（' + (err && err.message ? err.message : err) + '），請允許瀏覽器使用麥克風後再試一次。';
        isBusy = false;
        return;
      }

      recordedChunks = [];
      liveTranscript = '';
      playbackBox.innerHTML = '';
      transcriptBox.style.display = 'none';
      resultEl.classList.remove('show');
      submitBtn.disabled = true;

      try{
        mediaRecorder = new MediaRecorder(micStream);
      }catch(err){
        recordStatus.textContent = '無法啟動錄音功能（' + (err && err.message ? err.message : err) + '）。';
        isBusy = false;
        return;
      }

      mediaRecorder.ondataavailable = (e) => { if(e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'audio/webm' });
        const url = URL.createObjectURL(blob);
        playbackBox.innerHTML = `<audio controls src="${url}"></audio>`;

        isRecording = false;
        recordBtn.classList.remove('recording');
        recordBtnText.textContent = '🔁 重新錄音';
        isBusy = false;

        if(SpeechRecCtor){
          submitBtn.disabled = false;
          recordStatus.textContent = '錄音完成，可以播放確認，不滿意可按「🔁 重新錄音」，滿意再按「送出分析」';
        } else {
          recordStatus.textContent = '錄音完成（此瀏覽器不支援自動語音辨識分析，可播放錄音自行確認，或按「🔁 重新錄音」重錄）';
        }
      };

      mediaRecorder.start();
      startNewRecognition();

      isRecording = true;
      isBusy = false;
      recordBtn.classList.add('recording');
      recordBtnText.textContent = '⏹ 停止錄音';
      recordStatus.textContent = SpeechRecCtor ? '錄音中... 請清楚說出完整句子' : '錄音中...（此瀏覽器不支援自動語音辨識）';
    } else {
      // 停止錄音：狀態更新交給 mediaRecorder.onstop 統一處理，避免時序錯亂
      if(sttRecognition){ try{ sttRecognition.stop(); }catch(e){} }
      if(mediaRecorder && mediaRecorder.state !== 'inactive'){
        mediaRecorder.stop();
      }
      recordStatus.textContent = '處理錄音中...';
    }
  });

  submitBtn.addEventListener('click', () => {
    analyzeSpeaking(q, liveTranscript);
  });
}

function renderSpeaking(){
  const q = SPEAKING_QUESTIONS[speakIndex];
  const revealed = speakRevealed[speakIndex];
  renderSpeakDots();

  card.innerHTML = `
    <div class="speak-card-inner">
      <div class="qnum-row">
        <div class="qnum">Q<b>${speakIndex+1}</b> / ${SPEAKING_QUESTIONS.length}</div>
        <div class="qtag">口說題</div>
      </div>
      <div class="speak-en-row">
        <button class="speak-btn" id="speakBtn" title="播放題目語音">🔊</button>
        <div class="speak-en">${q.en}</div>
      </div>
      <div class="speak-hint">→ ${q.hint}</div>
      <div class="no-speech-note" id="noSpeechNote">這個瀏覽器不支援語音播放，可以請老師直接唸出題目。</div>

      ${revealed ? `
        <div class="sample-box show">
          <div class="sample-box-label">SAMPLE ANSWER</div>
          <div class="sample-row">
            <div class="sample-text">${q.sample}</div>
            <button class="sample-speak-btn" id="sampleSpeakBtn" title="播放範例答案語音">🔊</button>
          </div>
          <button class="reveal-btn" id="sampleZhToggleBtn" style="margin-top:12px;">🇹🇼 顯示中文翻譯</button>
          <div class="example-zh-text" id="sampleZhText" style="display:none;">${q.sampleZh}</div>
        </div>
      ` : `
        <button class="reveal-btn" id="revealBtn">💡 顯示範例答案</button>
      `}

      <div class="record-box" id="recordBox">
        <div class="record-box-label">🎙️ 錄下你的回答，確認後送出分析文法重點</div>
        <div class="record-controls">
          <button class="record-btn" id="recordBtn"><span class="record-dot"></span><span id="recordBtnText">開始錄音</span></button>
          <span class="record-status" id="recordStatus"></span>
        </div>
        <div class="record-playback" id="recordPlayback"></div>
        <div class="record-transcript" id="recordTranscriptBox" style="display:none;">
          <div class="record-transcript-label">辨識結果（語音辨識，可能不完全準確）</div>
          <div id="recordTranscriptText"></div>
        </div>
        <button class="record-submit-btn" id="recordSubmitBtn" disabled>送出分析</button>
        <div class="record-result" id="recordResult"></div>
      </div>

      <div class="footer-row split">
        <button class="nav-btn ghost" id="prevBtn" ${speakIndex===0?'disabled':''}>← 上一題</button>
        <button class="nav-btn" id="nextSpeakBtn" ${speakIndex===SPEAKING_QUESTIONS.length-1?'disabled':''}>下一題 →</button>
      </div>
    </div>
  `;

  if(!speechSupported){
    document.getElementById('noSpeechNote').classList.add('show');
  }

  document.getElementById('speakBtn').addEventListener('click', (e)=> speak(q.en, e.currentTarget));
  const revealBtn = document.getElementById('revealBtn');
  if(revealBtn){
    revealBtn.addEventListener('click', ()=>{
      speakRevealed[speakIndex] = true;
      renderSpeaking();
    });
  }
  const sampleBtn = document.getElementById('sampleSpeakBtn');
  if(sampleBtn){
    sampleBtn.addEventListener('click', (e)=> speak(q.sample, e.currentTarget));
  }
  const sampleZhToggleBtn = document.getElementById('sampleZhToggleBtn');
  if(sampleZhToggleBtn){
    const sampleZhText = document.getElementById('sampleZhText');
    sampleZhToggleBtn.addEventListener('click', ()=>{
      const showing = sampleZhText.style.display !== 'none';
      sampleZhText.style.display = showing ? 'none' : 'block';
      sampleZhToggleBtn.textContent = showing ? '🇹🇼 顯示中文翻譯' : '🇹🇼 隱藏中文翻譯';
    });
  }
  document.getElementById('prevBtn').addEventListener('click', ()=>{
    if(speakIndex > 0){ speakIndex--; renderSpeaking(); }
  });
  document.getElementById('nextSpeakBtn').addEventListener('click', ()=>{
    if(speakIndex < SPEAKING_QUESTIONS.length-1){ speakIndex++; renderSpeaking(); }
  });
  initRecordUI(q);
}

// ---------- Mode switching ----------
const MODE_CONFIG = {
  grammar: { questions: GRAMMAR_QUESTIONS, title: '現在完成式', sub: (n)=> `文法測驗．共 ${n} 題．每題點選答案後立即顯示對錯與說明`, syncLabel: '文法測驗' },
  reading: { questions: READING_QUESTIONS, title: READING_PASSAGE.title, sub: (n)=> `閱讀測驗．共 ${n} 題（閱讀理解＋文意選填）．請先閱讀短文再作答`, syncLabel: '閱讀測驗' },
  cloze: { questions: CLOZE_QUESTIONS, title: CLOZE_PASSAGE.title, sub: (n)=> `克漏字．共 ${n} 題．請先閱讀短文，選出最適合填入空格的字`, syncLabel: '克漏字測驗' },
  vocab: { questions: VOCAB_QUESTIONS, title: '國中單字測驗', sub: (n)=> `單字測驗．共 ${n} 題．選出最接近的中文意思`, syncLabel: '單字測驗' },
  listening: { questions: LISTENING_QUESTIONS, title: '聽力測驗', sub: (n)=> `聽力測驗．共 ${n} 題（情境問答）．聽題目與選項，選出正確答案`, syncLabel: '聽力測驗' }
};

function switchMode(newMode){
  window.speechSynthesis && window.speechSynthesis.cancel();
  cleanupRecording();
  mode = newMode;
  tabGrammar.classList.toggle('active', mode === 'grammar');
  tabReading.classList.toggle('active', mode === 'reading');
  tabCloze.classList.toggle('active', mode === 'cloze');
  tabVocab.classList.toggle('active', mode === 'vocab');
  tabListening.classList.toggle('active', mode === 'listening');
  tabSpeaking.classList.toggle('active', mode === 'speaking');

  if(mode === 'speaking'){
    tallyWrap.classList.add('hidden');
    speakProgress.classList.add('show');
    mainTitle.textContent = '口說練習';
    subTitle.textContent = `共 ${SPEAKING_QUESTIONS.length} 題．點🔊聽題目發音，回答完再看範例答案`;
    speakIndex = 0;
    renderSpeaking();
  } else {
    tallyWrap.classList.remove('hidden');
    speakProgress.classList.remove('show');
    const cfg = MODE_CONFIG[mode];
    questions = cfg.questions;
    mainTitle.textContent = cfg.title;
    subTitle.textContent = cfg.sub(cfg.questions.length);
    resetQuiz();
  }
}

tabGrammar.addEventListener('click', ()=> switchMode('grammar'));
tabReading.addEventListener('click', ()=> switchMode('reading'));
tabCloze.addEventListener('click', ()=> switchMode('cloze'));
tabVocab.addEventListener('click', ()=> switchMode('vocab'));
tabListening.addEventListener('click', ()=> switchMode('listening'));
tabSpeaking.addEventListener('click', ()=> switchMode('speaking'));

try{
  renderTally();
  renderQuestion();
}catch(e){
  card.innerHTML = `<div style="padding:20px;text-align:center;color:var(--chalk-red);">
    ⚠️ 頁面初始化時發生錯誤，請嘗試：<br>1. 用 Safari 開啟此檔案（不要用 App 內建瀏覽器或預覽模式）<br>2. 重新整理頁面<br><br>
    <span style="font-size:11px;color:var(--ink-soft);">錯誤訊息：${e.message}</span>
  </div>`;
}
</script>
</body>
</html>
