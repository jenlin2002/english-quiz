<style>
  :root{
    --chalk-bg: #1B3A2F;
    --paper: #F7F3E8;
    --paper-2: #EFE9D8;
    --chalk-yellow: #E8B94A;
    --chalk-red: #D97A6C;
    --chalk-green: #7FB69A;
    --ink: #2B2B2B;
    --ink-soft: #5B5B52;
    --line: #D8D0BA;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--chalk-bg);
    font-family:'Noto Sans TC', sans-serif;
    color:var(--paper);
    min-height:100vh;
    display:flex; flex-direction:column;
  }
  header{
    padding:14px 20px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid #2A4A3C; flex-wrap:wrap; gap:10px;
  }
  .title-block{ display:flex; flex-direction:column; gap:2px; }
  .eyebrow{
    font-family:'Space Mono', monospace; font-size:11px; letter-spacing:2px;
    color:var(--chalk-yellow); font-weight:700;
  }
  h1{ font-family:'Kalam', cursive; font-size:18px; color:var(--paper); }
  .nav-actions{ display:flex; gap:10px; align-items:center; }
  .home-link{
    font-family:'Noto Sans TC'; font-size:13px; color:var(--chalk-green);
    text-decoration:none; padding:8px 14px; border:1px solid #2A4A3C; border-radius:20px;
    transition:border-color 0.15s;
  }
  .home-link:hover{ border-color:var(--chalk-green); }

  .stage{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:16px; position:relative; overflow:hidden;
  }
  .slide-frame{
    max-width:100%; max-height:100%; width:100%; aspect-ratio:16/9;
    display:flex; align-items:center; justify-content:center;
    background:#000; border-radius:10px; overflow:hidden;
    box-shadow:0 8px 30px rgba(0,0,0,0.4);
    position:relative;
  }
  .slide-frame img{ width:100%; height:100%; object-fit:contain; display:block; }

  .arrow-btn{
    position:absolute; top:50%; transform:translateY(-50%);
    width:46px; height:46px; border-radius:50%; border:none;
    background:rgba(0,0,0,0.45); color:var(--paper); font-size:20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background 0.15s;
  }
  .arrow-btn:hover{ background:rgba(0,0,0,0.7); }
  .arrow-btn:disabled{ opacity:0.25; cursor:default; }
  .arrow-btn.prev{ left:24px; }
  .arrow-btn.next{ right:24px; }

  .sentence-btn{
    position:absolute; z-index:5; transform:translate(-50%,-50%);
    width:26px; height:26px; border-radius:50%; border:1.5px solid var(--chalk-yellow);
    background:rgba(27,58,47,0.85); color:var(--chalk-yellow); font-size:12px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.35);
    transition:transform 0.15s, background 0.15s;
  }
  .sentence-btn:hover{ transform:translate(-50%,-50%) scale(1.15); background:var(--chalk-yellow); color:var(--chalk-bg); }
  .sentence-btn.playing{ background:var(--chalk-yellow); color:var(--chalk-bg); animation:pulse 0.9s infinite; }
  @keyframes pulse{
    0%,100%{ box-shadow:0 2px 8px rgba(0,0,0,0.35); }
    50%{ box-shadow:0 2px 16px rgba(232,185,74,0.85); }
  }

  footer{
    padding:14px 20px; display:flex; align-items:center; justify-content:center; gap:16px;
    border-top:1px solid #2A4A3C;
  }
  .counter{
    font-family:'Space Mono', monospace; font-size:14px; color:var(--chalk-green); min-width:70px; text-align:center;
  }
  .dots{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:60vw; }
  .dot{
    width:8px; height:8px; border-radius:50%; background:#3A5648; cursor:pointer; border:none; padding:0;
    transition:background 0.15s, transform 0.15s;
  }
  .dot.active{ background:var(--chalk-yellow); transform:scale(1.3); }

  .quiz-link{
    font-family:'Noto Sans TC'; font-size:13px; color:var(--chalk-bg); background:var(--chalk-yellow);
    text-decoration:none; padding:8px 16px; border-radius:20px; font-weight:700;
    transition:opacity 0.15s;
  }
  .quiz-link:hover{ opacity:0.85; }

  @media (max-width: 640px){
    .arrow-btn{ width:38px; height:38px; font-size:16px; }
    .arrow-btn.prev{ left:8px; }
    .arrow-btn.next{ right:8px; }
    h1{ font-size:14px; }
    footer{ flex-wrap:wrap; }
  }

<script>
  let current = 0;
  const img = document.getElementById('slideImg');
  const counter = document.getElementById('counter');
  const dotsWrap = document.getElementById('dots');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const btnsWrap = document.getElementById('sentenceBtnsWrap');

  // ---------- 語音播放（穩健版，含語音清單載入等待與暖機機制）----------
  const speechSupported = typeof window.speechSynthesis !== 'undefined';
  let cachedVoices = [];
  function refreshVoiceCache(){ if(speechSupported) cachedVoices = window.speechSynthesis.getVoices(); }
  if(speechSupported){
    refreshVoiceCache();
    window.speechSynthesis.onvoiceschanged = refreshVoiceCache;
  }
  function pickVoice(lang){
    if(!cachedVoices.length) refreshVoiceCache();
    const prefix = lang.split('-')[0];
    const exactLocal = cachedVoices.find(v => v.lang === lang && v.localService === true);
    if(exactLocal) return exactLocal;
    const prefixLocal = cachedVoices.find(v => v.lang && v.lang.startsWith(prefix) && v.localService === true);
    if(prefixLocal) return prefixLocal;
    const exact = cachedVoices.find(v => v.lang === lang);
    if(exact) return exact;
    return cachedVoices.find(v => v.lang && v.lang.startsWith(prefix)) || null;
  }
  function whenVoicesReady(cb){
    if(cachedVoices.length > 0){ cb(); return; }
    refreshVoiceCache();
    if(cachedVoices.length > 0){ cb(); return; }
    let done = false;
    const finish = () => { if(done) return; done = true; cb(); };
    window.speechSynthesis.onvoiceschanged = () => { refreshVoiceCache(); finish(); };
    setTimeout(finish, 400);
  }
  let warmedUp = false;
  function warmUp(){
    if(warmedUp || !speechSupported) return;
    warmedUp = true;
    try{
      const w = new SpeechSynthesisUtterance(' ');
      w.volume = 0; w.rate = 10;
      window.speechSynthesis.speak(w);
    }catch(e){}
  }
  document.addEventListener('click', warmUp, { once:true, capture:true });

  function speakSentence(text, btnEl){
    if(!speechSupported) return;
    whenVoicesReady(() => {
      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();
      document.querySelectorAll('.sentence-btn').forEach(b => b.classList.remove('playing'));
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = 0.78;
      const v = pickVoice('en-US');
      if(v) utter.voice = v;
      btnEl.classList.add('playing');
      utter.onend = () => btnEl.classList.remove('playing');
      utter.onerror = () => btnEl.classList.remove('playing');
      window.speechSynthesis.speak(utter);
    });
  }

  function renderSentenceButtons(){
    btnsWrap.innerHTML = '';
    const list = SENTENCE_BUTTONS[current];
    if(!list) return;
    list.forEach(item => {
      const b = document.createElement('button');
      b.className = 'sentence-btn';
      b.style.left = item.x + '%';
      b.style.top = item.y + '%';
      b.textContent = '🔊';
      b.setAttribute('aria-label', '播放：' + item.text);
      b.addEventListener('click', (e) => { e.stopPropagation(); speakSentence(item.text, b); });
      btnsWrap.appendChild(b);
    });
  }

  function render(){
    img.src = SLIDES[current];
    counter.textContent = `${current + 1} / ${SLIDES.length}`;
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === SLIDES.length - 1;
    document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current));
    if(window.speechSynthesis) window.speechSynthesis.cancel();
    renderSentenceButtons();
  }

  function goTo(i){
    if(i < 0 || i >= SLIDES.length) return;
    current = i;
    render();
  }

  prevBtn.addEventListener('click', () => goTo(current - 1));
  nextBtn.addEventListener('click', () => goTo(current + 1));

  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowLeft') goTo(current - 1);
    if(e.key === 'ArrowRight') goTo(current + 1);
  });

  // touch swipe support
  let touchStartX = null;
  document.querySelector('.stage').addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
  });
  document.querySelector('.stage').addEventListener('touchend', (e) => {
    if(touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(dx > 50) goTo(current - 1);
    if(dx < -50) goTo(current + 1);
    touchStartX = null;
  });

  SLIDES.forEach((_, i) => {
    const b = document.createElement('button');
    b.className = 'dot';
    b.addEventListener('click', () => goTo(i));
    dotsWrap.appendChild(b);
  });

  render();
</script>
