<script>
window.GQUIZ = {
 "label": "Writing U2",
 "title": "寫作園地 Unit 2 我的寵物 造句練習",
 "back": "u02.html",
 "sections": [
  {
   "title": "① 句子合併：用括號裡的字把兩句合成一句",
   "note": "英檢初級寫作第一部分的題型。整句寫出來，句尾的標點可以不用打。",
   "items": [
    {
     "q": "I have a dog. It is very smart. (and)<br>→ {0}",
     "blanks": [
      [
       "I have a dog, and it is very smart.",
       "I have a dog and it is very smart."
      ]
     ],
     "exp": "and 連接兩個完整的句子：句子, and 句子。"
    },
    {
     "q": "My cat is small. My cat is fluffy. (and)<br>→ {0}",
     "blanks": [
      [
       "My cat is small and fluffy."
      ]
     ],
     "exp": "主詞一樣時，只要把兩個形容詞用 and 接起來。"
    },
    {
     "q": "I want a pet. My mom says no. (but)<br>→ {0}",
     "blanks": [
      [
       "I want a pet, but my mom says no.",
       "I want a pet but my mom says no."
      ]
     ],
     "exp": "but 連接意思相反的兩句。"
    },
    {
     "q": "Dogs are friendly. Many people love them. (so)<br>→ {0}",
     "blanks": [
      [
       "Dogs are friendly, so many people love them.",
       "Dogs are friendly so many people love them."
      ]
     ],
     "exp": "原因, so 結果。"
    },
    {
     "q": "We took our dog to the vet. He was sick. (because)<br>→ {0}",
     "blanks": [
      [
       "We took our dog to the vet because he was sick.",
       "Because he was sick, we took our dog to the vet."
      ]
     ],
     "exp": "結果 because 原因。"
    }
   ]
  },
  {
   "title": "② 句子改寫：照括號的要求改寫",
   "items": [
    {
     "q": "My brother feeds the fish every day.（改成否定句）<br>→ {0}",
     "blanks": [
      [
       "My brother doesn't feed the fish every day.",
       "My brother does not feed the fish every day."
      ]
     ],
     "exp": "第三人稱單數的否定：doesn't + 原形（feeds → feed）。"
    },
    {
     "q": "Your rabbit likes carrots.（改成 Does 開頭的問句）<br>→ {0}",
     "blanks": [
      [
       "Does your rabbit like carrots?"
      ]
     ],
     "exp": "Does 開頭，動詞改回原形：likes → like。"
    },
    {
     "q": "I walk my dog every day.（把 every day 改成 yesterday）<br>→ {0}",
     "blanks": [
      [
       "I walked my dog yesterday."
      ]
     ],
     "exp": "yesterday 是過去的時間，動詞用過去式 walked。"
    },
    {
     "q": "The cat is sleeping on the sofa.（針對 on the sofa 用 Where 問）<br>→ {0}",
     "blanks": [
      [
       "Where is the cat sleeping?"
      ]
     ],
     "exp": "Where + is + 主詞 + V-ing？"
    },
    {
     "q": "My puppy is very cute.（用 How 改成感嘆句）<br>→ {0}",
     "blanks": [
      [
       "How cute my puppy is!"
      ]
     ],
     "exp": "How + 形容詞 + 主詞 + 動詞！"
    }
   ]
  },

     "q": "a / have / pet / you / Do<br>→ {0}",

      [
       "Do you have a pet?"
      ]

    },
    {
     "q": "name / What's / dog's / your<br>→ {0}",
     "blanks": [
      [
       "What's your dog's name?",
       "What is your dog's name?"
      ]
     ],
     "exp": "your dog's name 你的狗的名字。"
    },
    {
     "q": "likes / My / cat / to / sleep / sun / in / the<br>→ {0}",
     "blanks": [
      [
       "My cat likes to sleep in the sun."
      ]

     "exp": "like to + 原形動詞。"
    },
    {
     "q": "take / of / care / I / my / every day / hamster<br>→ {0}",
     "blanks": [
      [
       "I take care of my hamster every day."
      ]
     ],
     "exp": "take care of + 照顧的對象。"
    },
    {
     "q": "can / your / A / be / friend / best / pet<br>→ {0}",
     "blanks": [
      [
       "A pet can be your best friend."
      ]
     ],
     "exp": "can + be + 名詞。"
    }
   ]
  }
 ]
};
