<script>
window.GQUIZ = {
 "label": "Writing U4",
 "title": "寫作園地 Unit 4 學校的一天 造句練習",
 "back": "u04.html",
 "sections": [
  {
   "title": "① 句子合併：用括號裡的字把兩句合成一句",
   "note": "英檢初級寫作第一部分的題型。整句寫出來，句尾的標點可以不用打。",
   "items": [
    {
     "q": "I eat lunch. Then I take a nap. (after)<br>→ {0}",
     "blanks": [
      [
       "After I eat lunch, I take a nap.",
       "I take a nap after I eat lunch.",
       "After lunch, I take a nap.",
       "I take a nap after lunch."
      ]
     ],
     "exp": "after + 先發生的事：After I eat lunch, I take a nap."
    },
    {
     "q": "I like math. I like science. (both … and …)<br>→ {0}",
     "blanks": [
      [
       "I like both math and science."
      ]
     ],
     "exp": "like both A and B＝A 和 B 都喜歡。"
    },
    {
     "q": "The test was hard. I passed it. (but)<br>→ {0}",
     "blanks": [
      [
       "The test was hard, but I passed it.",
       "The test was hard but I passed it."
      ]
     ],
     "exp": "but 接意思相反的兩句。"
    },
    {
     "q": "I was late for school. I missed the bus. (because)<br>→ {0}",
     "blanks": [
      [
       "I was late for school because I missed the bus.",
       "Because I missed the bus, I was late for school."
      ]
     ],
     "exp": "結果 because 原因。"
    },
    {
     "q": "We have P.E. on Tuesday. We have P.E. on Friday. (and)<br>→ {0}",
     "blanks": [
      [
       "We have P.E. on Tuesday and Friday.",
       "We have P.E. on Tuesday and on Friday.",
       "We have PE on Tuesday and Friday."
      ]
     ],
     "exp": "一樣的部分不用重複，只把兩個時間用 and 接起來。"
    }
   ]
  },
  {
   "title": "② 句子改寫：照括號的要求改寫",
   "items": [
    {
     "q": "I get to school at seven thirty.（針對 at seven thirty 用 What time 問）<br>→ {0}",
     "blanks": [
      [
       "What time do you get to school?"
      ]
     ],
     "exp": "What time + do + 主詞 + 原形動詞？I 改成 you。"
    },
    {
     "q": "We have a quiz today.（把 today 改成 tomorrow，用 will）<br>→ {0}",
     "blanks": [
      [
       "We will have a quiz tomorrow.",
       "We'll have a quiz tomorrow."
      ]
     ],
     "exp": "will + 原形動詞 表示未來。"
    },
    {
     "q": "Tom cleans the classroom every day.（把 every day 改成 now）<br>→ {0}",
     "blanks": [
      [
       "Tom is cleaning the classroom now."
      ]
     ],
     "exp": "now 用現在進行式：is + V-ing。"
    },
    {
     "q": "My favorite subject is art.（針對 art 用 What 問）<br>→ {0}",
     "blanks": [
      [
       "What is your favorite subject?",
       "What's your favorite subject?"
      ]
     ],
     "exp": "What is your favorite subject?"
    },
    {
     "q": "She did her homework at school.（改成否定句）<br>→ {0}",
     "blanks": [
      [
       "She didn't do her homework at school.",
       "She did not do her homework at school."
      ]
     ],
     "exp": "過去式否定：didn't + 原形（did → do）。"
    }
   ]
  },

     "q": "starts / class / at / My / first / eight<br>→ {0}",
     "blanks": [
      [
       "My first class starts at eight."

     "exp": "主詞 My first class + starts。"
    },
    {
     "q": "after / a / We / nap / lunch / take<br>→ {0}",
     "blanks": [
      [
       "We take a nap after lunch."
      ]

     "exp": "take a nap＝午睡。"
    },
    {
     "q": "is / subject / What / favorite / your<br>→ {0}",
     "blanks": [
      [
       "What is your favorite subject?"
      ]

     "exp": "What is + 名詞？"
    },
    {
     "q": "go / I / library / school / to / after / the<br>→ {0}",
     "blanks": [
      [
       "I go to the library after school.",
       "After school I go to the library."
      ]
     ],
     "exp": "after school 放句尾或句首都可以。"
    },
    {
     "q": "are / my / friendly / All / classmates / of<br>→ {0}",
     "blanks": [
      [
       "All of my classmates are friendly."
      ]
     ],
     "exp": "All of my classmates＝我所有的同學。"
    }
   ]
  }
 ]
};
