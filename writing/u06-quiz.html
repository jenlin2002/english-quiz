<script>
window.GQUIZ = {
 "label": "Writing U6",
 "title": "寫作園地 Unit 6 生日派對 造句練習",
 "back": "u06.html",
 "sections": [
  {
   "title": "① 句子合併：用括號裡的字把兩句合成一句",
   "note": "英檢初級寫作第一部分的題型。整句寫出來，句尾的標點可以不用打。",
   "items": [
    {
     "q": "We ate pizza. We played games. (and)<br>→ {0}",
     "blanks": [
      [
       "We ate pizza and played games.",
       "We ate pizza, and we played games.",
       "We ate pizza and we played games."
      ]
     ],
     "exp": "主詞一樣，兩個動作用 and 接。"
    },
    {
     "q": "She opened the present. She smiled. (when)<br>→ {0}",
     "blanks": [
      [
       "When she opened the present, she smiled.",
       "She smiled when she opened the present."
      ]
     ],
     "exp": "when 帶出「…的時候」。放句首要加逗號。"
    },
    {
     "q": "I wanted to go to the party. I was sick. (but)<br>→ {0}",
     "blanks": [
      [
       "I wanted to go to the party, but I was sick.",
       "I wanted to go to the party but I was sick."
      ]
     ],
     "exp": "but 接相反的兩句。"
    },
    {
     "q": "The party was fun. Nobody wanted to go home. (so … that …)<br>→ {0}",
     "blanks": [
      [
       "The party was so fun that nobody wanted to go home.",
       "The party was so much fun that nobody wanted to go home."
      ]
     ],
     "exp": "so + 形容詞 + that + 結果＝太…以致於…。"
    },
    {
     "q": "This is the card. I made it for my mom. (that)<br>→ {0}",
     "blanks": [
      [
       "This is the card that I made for my mom."
      ]
     ],
     "exp": "that 代替 it（the card），後面不要再寫 it。"
    }
   ]
  },
  {
   "title": "② 句子改寫：照括號的要求改寫",
   "items": [
    {
     "q": "We have a party every year.（把 every year 改成 last year）<br>→ {0}",
     "blanks": [
      [
       "We had a party last year."
      ]
     ],
     "exp": "have 的過去式是 had。"
    },
    {
     "q": "She got a new bike for her birthday.（改成 Did 開頭的問句）<br>→ {0}",
     "blanks": [
      [
       "Did she get a new bike for her birthday?"
      ]
     ],
     "exp": "Did + 主詞 + 原形：got → get。"
    },
    {
     "q": "My birthday is on June 5th.（針對 on June 5th 用 When 問）<br>→ {0}",
     "blanks": [
      [
       "When is your birthday?",
       "When's your birthday?"
      ]
     ],
     "exp": "When is + 名詞？my → your。"
    },
    {
     "q": "Ben blew out the candles.（改成否定句）<br>→ {0}",
     "blanks": [
      [
       "Ben didn't blow out the candles.",
       "Ben did not blow out the candles."
      ]
     ],
     "exp": "didn't + 原形 blow。"
    },
    {
     "q": "Let's sing a song for her.（改成 How about 開頭）<br>→ {0}",
     "blanks": [
      [
       "How about singing a song for her?"
      ]
     ],
     "exp": "How about + V-ing？"
    }
   ]
  },
  {
   "title": "③ 重組句子：把字詞排成正確的句子",
   "note": "第一個字的大寫已經幫你標好了。",
   "items": [
    {
     "q": "wish / a / Make / blow / and / the / out / candles<br>→ {0}",
     "blanks": [
      [
       "Make a wish and blow out the candles."
      ]
     ],
     "exp": "祈使句：動詞原形開頭。"
    },
    {
     "q": "party / invited / She / to / me / her<br>→ {0}",
     "blanks": [
      [
       "She invited me to her party."
      ]
     ],
     "exp": "invite 人 to 活動。"
    },
    {
     "q": "the / with / We / room / balloons / decorated<br>→ {0}",
     "blanks": [
      [
       "We decorated the room with balloons."
      ]
     ],
     "exp": "decorate A with B。"
    },
    {
     "q": "you / for / Thank / the / present / lovely<br>→ {0}",
     "blanks": [
      [
       "Thank you for the lovely present."
      ]
     ],
     "exp": "Thank you for + 東西。"
    },
    {
     "q": "fun / Everyone / a / of / had / lot<br>→ {0}",
     "blanks": [
      [
       "Everyone had a lot of fun."
      ]
     ],
     "exp": "have a lot of fun＝玩得很開心。"
    }
   ]
  }
 ]
};
