<script>

 "back": "u11.html",
 "sections": [
  {
   "title": "① 句子合併：用括號裡的字把兩句合成一句",
   "note": "英檢初級寫作第一部分的題型。整句寫出來，句尾的標點可以不用打。",
   "items": [
    {
     "q": "I want to be a doctor. I want to help sick people. (because)<br>→ {0}",
     "blanks": [
      [
       "I want to be a doctor because I want to help sick people."
      ]
     ],
     "exp": "結果 because 原因。"
    },
    {
     "q": "My dream is hard. I will not give up. (but)<br>→ {0}",
     "blanks": [
      [
       "My dream is hard, but I will not give up.",
       "My dream is hard, but I won't give up.",
       "My dream is hard but I will not give up.",
       "My dream is hard but I won't give up."
      ]
     ],
     "exp": "but 接相反的兩句。"
    },
    {
     "q": "I practice every day. I want to be a good singer. (so that)<br>→ {0}",
     "blanks": [
      [
       "I practice every day so that I can be a good singer.",
       "I practice every day so that I will be a good singer."
      ]
     ],
     "exp": "so that + 主詞 + can／will＝為了能…。"
    },
    {
     "q": "I was young. I wanted to be a police officer. (When)<br>→ {0}",
     "blanks": [
      [
       "When I was young, I wanted to be a police officer.",

     "exp": "原因, so 結果。"

   ]
  },
  {

      [
       "Do you want to be an artist?"
      ]

     "exp": "Do you want to…？"

    {

     "blanks": [
      [
       "What does she want to be?"

     "exp": "What does + 主詞 + want to be？"
    },
    {
     "q": "I will open a café.（改成否定句）<br>→ {0}",
     "blanks": [
      [
       "I won't open a café.",
       "I will not open a café.",
       "I won't open a cafe.",
       "I will not open a cafe."
      ]

      [
       "It is hard to be a doctor.",

     ],
     "exp": "V-ing 當主詞 ＝ It is + 形容詞 + to + 原形。"

    },

     "q": "up / Never / your / give / dream / on<br>→ {0}",
     "blanks": [

       "Never give up on your dream."

      ]

     "q": "come / will / I / my / true / hope / dream<br>→ {0}",
     "blanks": [
      [
       "I hope my dream will come true."
      ]
     ],
     "exp": "come true＝實現。"
    },
    {
     "q": "need / I / to / English / study / hard<br>→ {0}",
     "blanks": [
      [
       "I need to study English hard."
      ]
     ],
     "exp": "need to + 原形；hard（努力地）放在受詞 English 後面。"
    }
   ]
  }
 ]
};
