   "items": [
    {
     "q": "I was late. I missed the bus. (because)<br>→ {0}",
     "blanks": [
      [
       "I was late because I missed the bus.",
       "Because I missed the bus, I was late."

     ],
     "exp": "結果 because 原因。"

    {
     "q": "I broke your cup. I didn't mean to. (but)<br>→ {0}",
     "blanks": [
      [
       "I broke your cup, but I didn't mean to.",

       "I broke your cup, but I did not mean to."

     "exp": "原因, so 結果。"
    },

   ]
  }
 ]
