<script>
window.GQUIZ = {
 "label": "Writing U10",
 "title": "寫作園地 Unit 10 一次旅行 造句練習",
 "back": "u10.html",
 "sections": [
  {
   "title": "① 句子合併：用括號裡的字把兩句合成一句",
   "note": "英檢初級寫作第一部分的題型。整句寫出來，句尾的標點可以不用打。",
   "items": [
    {
     "q": "We went to the beach. We swam in the sea. (and)<br>→ {0}",
     "blanks": [
      [
       "We went to the beach and swam in the sea.",
       "We went to the beach, and we swam in the sea.",
       "We went to the beach and we swam in the sea."
      ]
     ],
     "exp": "主詞一樣，兩個過去式動詞用 and 接。"
    },
    {
     "q": "It rained. We stayed in the hotel. (because)<br>→ {0}",
     "blanks": [
      [
       "We stayed in the hotel because it rained.",
       "Because it rained, we stayed in the hotel."
      ]
     ],
     "exp": "結果 because 原因。"
    },
    {
     "q": "We were tired. We were happy. (but)<br>→ {0}",
     "blanks": [
      [
       "We were tired, but we were happy.",

      ]
     ],
     "exp": "but 接相反的感覺。"
    },
    {
     "q": "We arrived at the hotel. We went out for dinner. (after)<br>→ {0}",

     "exp": "after + 先發生的事。"
    },
    {
     "q": "I saw a beautiful temple. It was built 300 years ago. (which)<br>→ {0}",
     "blanks": [
      [
       "I saw a beautiful temple which was built 300 years ago.",
       "I saw a beautiful temple, which was built 300 years ago."
      ]
     ],
     "exp": "which 代替東西（the temple）。"
    }
   ]
  },
  {
   "title": "② 句子改寫：照括號的要求改寫",

      [
       "I went to Taichung last summer."
      ]
     ],
     "exp": "go 的過去式是 went。"
    },
    {
     "q": "We stayed there for three days.（針對 for three days 用 How long 問，主詞換成 you）<br>→ {0}",

      [
       "How long did you stay there?"
      ]
     ],
     "exp": "How long did + 主詞 + 原形？"
    },
    {
     "q": "They went to Hualien by train.（針對 by train 用 How 問）<br>→ {0}",
     "blanks": [
      [
       "How did they go to Hualien?",
       "How did they get to Hualien?"

     "q": "The trip was very interesting.（用 What 改成感嘆句）<br>→ {0}",

      [
       "What an interesting trip it was!"

     "exp": "What + an + 形容詞 + 名詞 + 主詞 + 動詞！interesting 母音開頭用 an。"

      [
       "I haven't been to Kenting.",
       "I have not been to Kenting.",
       "I have never been to Kenting."
      ]
     ],

    }
   ]

      [
       "I took a lot of pictures."

    },
    {
     "q": "can / hope / I / I / go / again / there<br>→ {0}",
     "blanks": [
      [
       "I hope I can go there again."
      ]
     ],
     "exp": "I hope + 子句。"
    }
   ]
  }
 ]
