  <h1>我的週末 <span class="zh">造句練習</span></h1>
  <div class="subtitle">句子合併 → 句子改寫 → 重組句子（全民英檢初級寫作題型）。全部作答才能送出，錯題要訂正到全對。</div>
  <section class="part wr-quiz"><div id="gquiz"></div></section>
</div>
<script>
window.GQUIZ = {
 "label": "Writing U1",
 "title": "寫作園地 Unit 1 我的週末 造句練習",
 "back": "u01.html",
 "sections": [
  {
   "title": "① 句子合併：用括號裡的字把兩句合成一句",
   "note": "英檢初級寫作第一部分的題型。整句寫出來，句尾的標點可以不用打。",
   "items": [
    {
     "q": "I got up late. I missed the bus. (so)<br>→ {0}",
     "blanks": [
      [
       "I got up late, so I missed the bus.",
       "I got up late so I missed the bus."
      ]
     ],
     "exp": "so（所以）放在結果的前面：原因, so 結果。"
    },
    {
     "q": "It was raining. We stayed home. (because)<br>→ {0}",
     "blanks": [
      [
       "We stayed home because it was raining.",
       "Because it was raining, we stayed home.",
       "Because it was raining we stayed home."
      ]
     ],
     "exp": "because（因為）放在原因的前面：結果 because 原因。"
    },
    {
     "q": "I finished my homework. Then I watched a movie. (after)<br>→ {0}",
     "blanks": [
      [
       "After I finished my homework, I watched a movie.",
       "After I finished my homework I watched a movie.",
       "I watched a movie after I finished my homework."
      ]
     ],
     "exp": "after（在…之後）接先發生的事：After 先做的事, 後做的事。"
    },
    {
     "q": "I wanted to go out. I was too tired. (but)<br>→ {0}",
     "blanks": [
      [
       "I wanted to go out, but I was too tired.",
       "I wanted to go out but I was too tired."
      ]
     ],
     "exp": "but（但是）連接意思相反的兩句。"
    },
    {
     "q": "My dad went hiking. I went hiking, too. (and)<br>→ {0}",
     "blanks": [
      [
       "My dad and I went hiking.",
       "My dad went hiking, and I went hiking, too.",
       "My dad went hiking and I went hiking too."
      ]
     ],
     "exp": "兩個人做同一件事，可以把主詞合起來：My dad and I went hiking."
    }
   ]
  },
  {
   "title": "② 句子改寫：照括號的要求改寫",
   "items": [
    {
     "q": "I play basketball every Saturday.（把 every Saturday 改成 last Saturday）<br>→ {0}",
     "blanks": [
      [
       "I played basketball last Saturday."
      ]
     ],
     "exp": "last Saturday 是過去的時間，動詞用過去式 played。"
    },
    {
     "q": "She goes shopping with her mom on Sundays.（改成否定句）<br>→ {0}",
     "blanks": [
      [
       "She doesn't go shopping with her mom on Sundays.",
       "She does not go shopping with her mom on Sundays."
      ]
     ],
     "exp": "第三人稱單數的否定：doesn't + 原形動詞（goes → go）。"
    },
    {
     "q": "They visited their grandparents last weekend.（改成 Did 開頭的問句）<br>→ {0}",
     "blanks": [
      [
       "Did they visit their grandparents last weekend?"
      ]
     ],
     "exp": "Did 開頭的問句，後面的動詞要改回原形：visited → visit。"
    },
    {
     "q": "Tom watched a movie on Sunday.（針對 on Sunday 用 When 問）<br>→ {0}",
     "blanks": [
      [
       "When did Tom watch a movie?"
      ]
     ],
     "exp": "When + did + 主詞 + 原形動詞？"
    },
    {
     "q": "I will clean my room tomorrow.（用 be going to 改寫）<br>→ {0}",
     "blanks": [
      [
       "I am going to clean my room tomorrow.",
       "I'm going to clean my room tomorrow."
      ]
     ],
     "exp": "will + 原形 = be going to + 原形，都表示未來要做的事。"
    }
   ]
  },
  {
   "title": "③ 重組句子：把字詞排成正確的句子",
   "note": "第一個字的大寫已經幫你標好了。",
   "items": [
    {
     "q": "weekend / How / your / was<br>→ {0}",
     "blanks": [
      [
       "How was your weekend?"
      ]
     ],
     "exp": "問「週末過得怎樣」：How was your weekend?"
    },
    {
     "q": "late / I / on / sleep / Saturdays / usually<br>→ {0}",
     "blanks": [
      [
       "I usually sleep late on Saturdays."
      ]
     ],
     "exp": "頻率副詞 usually 放在一般動詞前面。"
    },
    {
     "q": "with / went / my / We / to / cousins / the beach<br>→ {0}",
     "blanks": [
      [
       "We went to the beach with my cousins.",
       "We went with my cousins to the beach."
      ]
     ],
     "exp": "主詞 + 動詞 + 地點 + with 人。"
    },
    {
     "q": "fun / was / It / a / day / really<br>→ {0}",
     "blanks": [
      [
       "It was a really fun day.",
       "It really was a fun day."
      ]
     ],
     "exp": "a really fun day：really 修飾 fun。"
    },
    {
     "q": "next / do / want / What / you / weekend / do / to<br>→ {0}",
     "blanks": [
      [
       "What do you want to do next weekend?"
      ]
     ],
     "exp": "What do you want to do…? 你想要做什麼？"
    }
   ]
  }
 ]
};
</script>
