   "items": [

     "q": "My dad is tall. My dad is funny. (and)<br>→ {0}",
     "blanks": [
      [
       "My dad is tall and funny."
      ]
     ],
     "exp": "主詞一樣時，兩個形容詞用 and 接起來。"

    {
     "q": "My mom is a nurse. My aunt is a nurse, too. (Both … and …)<br>→ {0}",

      [
       "Both my mom and my aunt are nurses.",

      ]

    }
   ]
  }
 ]
